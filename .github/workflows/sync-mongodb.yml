name: Synchroniser MongoDB Atlas

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - pokemon-go-data-updated
  push:
    branches:
      - main
    paths:
      - "src/sync/**"
      - "src/models/**"
      - "scripts/sync/run.js"
      - "scripts/data/ensure-data.js"
      - "package*.json"

concurrency:
  group: mongodb-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sync
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          POKEMON_GO_DATA_TOKEN: ${{ secrets.POKEMON_GO_DATA_TOKEN }}
