name: Verify regenerations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  serverless-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:regenerations
        env:
          POKEMON_GO_DATA_TOKEN: ${{ secrets.POKEMON_GO_DATA_TOKEN }}
