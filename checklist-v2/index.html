<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checklist Pokémon V2</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080d19;
        --panel: #121a2d;
        --soft: #1d2842;
        --line: #2c3a5e;
        --text: #f4f7ff;
        --muted: #9eabc8;
        --blue: #67a9ff;
        --green: #48d889;
        --orange: #ffb85c;
        --red: #ff7474;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #182d5b 0, var(--bg) 36rem);
      }
      main {
        width: min(1280px, calc(100% - 28px));
        margin: 30px auto;
      }
      h1 {
        margin-bottom: 6px;
      }
      .subtitle {
        margin-top: 0;
        color: var(--muted);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 22px 0;
      }
      .stat,
      .toolbar,
      .entry {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #121a2deb;
      }
      .stat {
        padding: 14px;
      }
      .stat strong {
        display: block;
        font-size: 1.6rem;
      }
      .stat span {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        padding: 13px;
        margin-bottom: 16px;
      }
      input,
      select,
      button {
        border: 1px solid #3b4a70;
        border-radius: 8px;
        padding: 9px 11px;
        color: var(--text);
        background: var(--soft);
        font: inherit;
      }
      input[type="search"] {
        min-width: 240px;
        flex: 1;
      }
      button {
        cursor: pointer;
      }
      .entry {
        display: grid;
        grid-template-columns: auto 82px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: start;
        padding: 13px;
        margin-bottom: 9px;
      }
      .entry.done {
        border-color: #347e59;
      }
      .entry input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--green);
      }
      .portrait {
        position: relative;
        width: 82px;
        height: 82px;
        border: 1px solid #354568;
        border-radius: 16px;
        background: radial-gradient(circle, #354b77, #172039 70%);
        overflow: hidden;
      }
      .portrait img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 4px;
        object-fit: contain;
        transition: 0.2s;
      }
      .portrait img.shiny {
        opacity: 0;
      }
      .portrait:hover img.shiny {
        opacity: 1;
      }
      .portrait:hover img {
        transform: scale(1.07);
      }
      .name {
        font-weight: 800;
      }
      .meta,
      .file {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .file {
        margin-top: 4px;
        font-family: ui-monospace, monospace;
      }
      .badges {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 5px;
      }
      .badge {
        padding: 4px 8px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--soft);
        font-size: 0.72rem;
        white-space: nowrap;
      }
      .badge.good {
        color: var(--green);
      }
      .badge.manual {
        color: var(--blue);
      }
      .badge.bad {
        color: var(--orange);
      }
      details {
        margin-top: 10px;
        border: 1px solid #4d4537;
        border-radius: 10px;
        background: #231e1980;
        overflow: hidden;
      }
      summary {
        padding: 9px 11px;
        color: var(--orange);
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 750;
      }
      .groups {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 8px;
        padding: 0 9px 9px;
      }
      .group {
        padding: 9px;
        border: 1px solid #34415f;
        border-radius: 9px;
        background: #151d31;
      }
      .group-title {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .count {
        color: var(--orange);
      }
      .issues {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .issue {
        padding: 6px 7px;
        border-radius: 6px;
        background: #222d49;
        font-size: 0.72rem;
        overflow-wrap: anywhere;
      }
      .issue strong {
        color: #dce5ff;
      }
      .issue span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
      }
      .empty {
        padding: 45px;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 780px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .entry {
          grid-template-columns: auto 64px minmax(0, 1fr);
        }
        .portrait {
          width: 64px;
          height: 64px;
        }
        .badges {
          grid-column: 3;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Checklist complète V2</h1>
      <p class="subtitle">
        Validation récursive de toutes les sections JSON, adaptée au stade
        d’évolution et aux formes.
      </p>
      <section class="stats">
        <div class="stat">
          <strong id="done">-</strong><span>fiches terminées</span>
        </div>
        <div class="stat">
          <strong id="todo">-</strong><span>fiches à compléter</span>
        </div>
        <div class="stat">
          <strong id="issues">-</strong><span>problèmes détectés</span>
        </div>
        <div class="stat">
          <strong id="total">-</strong><span>fiches analysées</span>
        </div>
      </section>
      <section class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Rechercher un Pokémon, numéro ou fichier…"
        />
        <select id="kind">
          <option value="all">Tous les types</option>
          <option value="pokemon">Pokémon principaux</option>
          <option value="form">Formes</option>
          <option value="mega">Méga / Primo</option>
        </select>
        <select id="profile">
          <option value="all">Tous les profils</option>
          <option value="base">Base</option>
          <option value="intermediate">Intermédiaire</option>
          <option value="final">Final</option>
          <option value="single">Sans évolution</option>
          <option value="mega">Méga / Primo</option>
        </select>
        <select id="form">
          <option value="all">Toutes les formes</option>
        </select>
        <select id="status">
          <option value="todo">À compléter</option>
          <option value="all">Tous les statuts</option>
          <option value="done">Terminés</option>
        </select>
        <button id="refresh">Actualiser</button>
      </section>
      <section id="entries"></section>
    </main>
    <script>
      const state = { entries: [], progress: {} };
      const ids = [
        "done",
        "todo",
        "issues",
        "total",
        "search",
        "kind",
        "profile",
        "form",
        "status",
        "refresh",
        "entries",
      ];
      const el = Object.fromEntries(
        ids.map((id) => [id, document.getElementById(id)]),
      );
      const profileLabels = {
        base: "Base",
        intermediate: "Intermédiaire",
        final: "Final",
        single: "Sans évolution",
        mega: "Méga / Primo",
      };
      const groupLabels = {
        id: "Identité",
        formId: "Identité",
        slug: "Identité",
        dexId: "Identité",
        dexNr: "Identité",
        generation: "Identité",
        form: "Identité",
        names: "Traductions",
        region: "Région",
        size: "Taille",
        weatherBoost: "Gameplay",
        buddyDistance: "Gameplay",
        catchRate: "Gameplay",
        fleeRate: "Gameplay",
        captureRewards: "Récompenses",
        megaEnergyReward: "Récompenses",
        secondChargeMoveCost: "Seconde attaque",
        availability: "Disponibilité",
        maxCp: "PC maximum",
        pvp: "PvP",
        stats: "Statistiques",
        primaryType: "Types",
        secondaryType: "Types",
        pokemonClass: "Identité",
        quickMoves: "Attaques rapides",
        cinematicMoves: "Attaques chargées",
        eliteQuickMoves: "Attaques élite",
        eliteCinematicMoves: "Attaques élite",
        assets: "Images",
        regionForms: "Formes régionales",
        evolutions: "Évolutions",
        hasMegaEvolution: "Méga / Gigantamax",
        megaEvolutions: "Méga / Gigantamax",
        hasGigantamaxEvolution: "Méga / Gigantamax",
        assetForms: "Images de formes",
        energyCost: "Méga / Primo",
      };
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      const isDone = (entry) =>
        entry.complete || Boolean(state.progress[entry.key]);
      function groupIssues(issues) {
        const groups = {};
        for (const issue of issues) {
          const root = issue.path.split(/[.[]/)[0] || "autres";
          const label = groupLabels[root] || "Autres";
          (groups[label] ??= []).push(issue);
        }
        return groups;
      }
      function issueText(issue) {
        const labels = {
          missing: "Champ absent",
          type: "Mauvais type",
          empty: "Valeur vide",
        };
        return `<div class="issue"><strong>${esc(issue.path || "racine")}</strong><span>${labels[issue.issue] || issue.issue} · attendu : ${esc(issue.expected)} · actuel : ${esc(issue.actual)}</span></div>`;
      }
      function details(entry) {
        if (!entry.issues.length) return "";
        const groups = groupIssues(entry.issues);
        return `<details><summary>${entry.issues.length} problème${entry.issues.length > 1 ? "s" : ""} · afficher le détail</summary><div class="groups">${Object.entries(
          groups,
        )
          .map(
            ([label, issues]) =>
              `<section class="group"><div class="group-title"><span>${esc(label)}</span><span class="count">${issues.length}</span></div><div class="issues">${issues.map(issueText).join("")}</div></section>`,
          )
          .join("")}</div></details>`;
      }
      function updateStats() {
        const done = state.entries.filter(isDone).length;
        el.done.textContent = done;
        el.todo.textContent = state.entries.length - done;
        el.issues.textContent = state.entries.reduce(
          (sum, e) => sum + e.issues.length,
          0,
        );
        el.total.textContent = state.entries.length;
      }
      function render() {
        const q = el.search.value.trim().toLocaleLowerCase("fr");
        const visible = state.entries.filter((e) => {
          const done = isDone(e);
          return (
            (!q ||
              [e.name, e.dexId, e.file, e.form].some((v) =>
                String(v || "")
                  .toLocaleLowerCase("fr")
                  .includes(q),
              )) &&
            (el.kind.value === "all" || e.kind === el.kind.value) &&
            (el.profile.value === "all" || e.profile === el.profile.value) &&
            (el.form.value === "all" || e.form === el.form.value) &&
            (el.status.value === "all" ||
              (el.status.value === "done" ? done : !done))
          );
        });
        el.entries.innerHTML = visible.length
          ? visible
              .map((e) => {
                const done = isDone(e),
                  manual = Boolean(state.progress[e.key]);
                const image = e.image
                  ? `<div class="portrait"><img src="${esc(e.image)}" alt="${esc(e.name)}" loading="lazy">${e.shinyImage ? `<img class="shiny" src="${esc(e.shinyImage)}" alt="${esc(e.name)} shiny" loading="lazy">` : ""}</div>`
                  : '<div class="portrait"></div>';
                return `<article class="entry ${done ? "done" : ""}"><input type="checkbox" data-key="${esc(e.key)}" ${done ? "checked" : ""} ${e.complete ? "disabled" : ""}>${image}<div><div class="name">#${esc(e.dexId)} · ${esc(e.name)}</div><div class="meta">${profileLabels[e.profile] || e.profile} · ${esc(e.form)} · génération ${esc(e.generation || "?")}</div><div class="file">${esc(e.file)}</div>${details(e)}</div><div class="badges">${e.complete ? '<span class="badge good">JSON complet</span>' : ""}${manual ? '<span class="badge manual">coché manuellement</span>' : ""}${!done ? `<span class="badge bad">${e.issues.length} problème(s)</span>` : ""}</div></article>`;
              })
              .join("")
          : '<div class="empty">Aucune fiche ne correspond aux filtres.</div>';
        el.entries
          .querySelectorAll("input[type=checkbox]:not(:disabled)")
          .forEach((box) =>
            box.addEventListener("change", async () => {
              const r = await fetch("/api/progress-v2", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({
                  key: box.dataset.key,
                  checked: box.checked,
                }),
              });
              state.progress = (await r.json()).progress;
              render();
              updateStats();
            }),
          );
        updateStats();
      }
      async function load() {
        el.refresh.disabled = true;
        const r = await fetch("/api/checklist-v2");
        Object.assign(state, await r.json());
        const selected = el.form.value,
          forms = [
            ...new Set(state.entries.map((e) => e.form).filter(Boolean)),
          ].sort();
        el.form.innerHTML =
          '<option value="all">Toutes les formes</option>' +
          forms
            .map((f) => `<option value="${esc(f)}">${esc(f)}</option>`)
            .join("");
        el.form.value = forms.includes(selected) ? selected : "all";
        el.refresh.disabled = false;
        render();
      }
      ["search", "kind", "profile", "form", "status"].forEach((id) =>
        el[id].addEventListener("input", render),
      );
      el.refresh.addEventListener("click", load);
      load();
    </script>
  </body>
</html>
