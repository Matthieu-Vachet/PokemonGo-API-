<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist Pokémon GO</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151c32;
      --panel-light: #202a47;
      --text: #f6f8ff;
      --muted: #aeb8d3;
      --blue: #58a6ff;
      --green: #43d17a;
      --orange: #ffb454;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1a2852 0, var(--bg) 34rem);
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 36px auto; }
    h1 { margin-bottom: 8px; }
    .subtitle { margin-top: 0; color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 24px 0; }
    .stat, .toolbar, .entry {
      border: 1px solid #2c3758;
      border-radius: 14px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
    }
    .stat { padding: 16px; }
    .stat strong { display: block; font-size: 1.7rem; }
    .stat span { color: var(--muted); font-size: .85rem; }
    .progress { height: 10px; overflow: hidden; border-radius: 10px; background: var(--panel-light); }
    .progress div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .2s; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; margin: 18px 0; }
    input, select, button {
      border: 1px solid #38466d;
      border-radius: 9px;
      padding: 10px 12px;
      color: var(--text);
      background: var(--panel-light);
      font: inherit;
    }
    input[type="search"] { min-width: 250px; flex: 1; }
    button { cursor: pointer; }
    button:hover { border-color: var(--blue); }
    .entry { display: grid; grid-template-columns: auto 76px 1fr auto; gap: 14px; align-items: start; padding: 12px 14px; margin-bottom: 9px; }
    .entry.done { border-color: color-mix(in srgb, var(--green) 55%, #2c3758); }
    .entry input[type="checkbox"] { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--green); }
    .entry-content { min-width: 0; }
    .portrait {
      position: relative;
      width: 76px;
      height: 76px;
      border: 1px solid #303c61;
      border-radius: 16px;
      background: radial-gradient(circle, #34436d 0, #1b2440 68%);
      filter: drop-shadow(0 5px 8px #05081580);
      overflow: hidden;
    }
    .pokemon-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 4px;
      object-fit: contain;
      transition: opacity .2s, transform .2s;
    }
    .portrait:hover .pokemon-image { transform: scale(1.08); }
    .pokemon-image.shiny { opacity: 0; }
    .portrait:hover .pokemon-image.shiny { opacity: 1; }
    .missing-image { display: grid; place-items: center; color: var(--muted); font-size: .7rem; text-align: center; }
    .name { font-weight: 750; }
    .meta, .file { color: var(--muted); font-size: .85rem; }
    .file { margin-top: 5px; font-family: ui-monospace, monospace; }
    .error { color: var(--red); }
    .missing-details {
      margin-top: 11px;
      border: 1px solid #4c4538;
      border-radius: 10px;
      background: #241f1a80;
      overflow: hidden;
    }
    .missing-details summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      color: var(--orange);
      cursor: pointer;
      list-style: none;
      font-size: .82rem;
      font-weight: 700;
      user-select: none;
    }
    .missing-details summary::-webkit-details-marker { display: none; }
    .missing-details summary::before {
      content: "›";
      font-size: 1.25rem;
      line-height: .8;
      transition: transform .15s;
    }
    .missing-details[open] summary::before { transform: rotate(90deg); }
    .missing-groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      padding: 0 10px 10px;
    }
    .missing-group {
      min-width: 0;
      padding: 9px;
      border: 1px solid #37425f;
      border-radius: 9px;
      background: #161d31;
    }
    .missing-group-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--text);
      font-size: .75rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .045em;
    }
    .missing-group-count {
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 999px;
      color: var(--orange);
      background: #352b1d;
      text-align: center;
    }
    .missing-fields { display: flex; flex-wrap: wrap; gap: 5px; }
    .missing-field {
      padding: 4px 7px;
      border-radius: 6px;
      color: #d7def2;
      background: #252f4d;
      font-size: .72rem;
      line-height: 1.2;
    }
    .badges { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .badge { border-radius: 999px; padding: 4px 8px; background: var(--panel-light); color: var(--muted); font-size: .75rem; white-space: nowrap; }
    .badge.auto { color: var(--green); }
    .badge.manual { color: var(--blue); }
    .empty { padding: 45px; text-align: center; color: var(--muted); }
    @media (max-width: 760px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .entry { grid-template-columns: auto 62px 1fr; }
      .portrait { width: 62px; height: 62px; }
      .badges { grid-column: 3; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Checklist des fiches Pokémon</h1>
    <p class="subtitle">Les fiches complètes sont détectées automatiquement. Tu peux aussi les cocher manuellement.</p>

    <section class="stats">
      <div class="stat"><strong id="doneCount">-</strong><span>terminés</span></div>
      <div class="stat"><strong id="todoCount">-</strong><span>à faire</span></div>
      <div class="stat"><strong id="pokemonCount">-</strong><span>Pokémon</span></div>
      <div class="stat"><strong id="formCount">-</strong><span>autres formes</span></div>
      <div class="stat"><strong id="megaCount">-</strong><span>Méga / Primo</span></div>
    </section>
    <div class="progress"><div id="progressBar"></div></div>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Rechercher un nom, numéro ou fichier…">
      <select id="type">
        <option value="all">Toutes les fiches</option>
        <option value="pokemon">Pokémon uniquement</option>
        <option value="form">Autres formes uniquement</option>
        <option value="mega">Méga / Primo uniquement</option>
      </select>
      <select id="form"><option value="all">Toutes les formes</option></select>
      <select id="status">
        <option value="todo">À faire uniquement</option>
        <option value="all">Tous les statuts</option>
        <option value="done">Terminés uniquement</option>
      </select>
      <select id="generation"><option value="all">Toutes générations</option></select>
      <button id="refresh" type="button">Actualiser l’analyse</button>
    </section>

    <section id="entries"></section>
  </main>

  <script>
    const state = { entries: [], progress: {} };
    const elements = Object.fromEntries(
      ["doneCount", "todoCount", "pokemonCount", "formCount", "megaCount", "progressBar", "search", "type", "form", "status", "generation", "refresh", "entries"]
        .map((id) => [id, document.getElementById(id)])
    );

    function isDone(entry) {
      return entry.complete || Boolean(state.progress[entry.key]);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function formatLeague(league) {
      return ({
        littleCup: "Little Cup",
        greatLeague: "Great League",
        ultraLeague: "Ultra League",
        masterLeague: "Master League",
      })[league] || league;
    }

    const missingFieldLabels = {
      "size.height": "Taille",
      "size.weight": "Poids",
      weatherBoost: "Boost météo",
      buddyDistance: "Distance copain",
      catchRate: "Taux de capture",
      fleeRate: "Taux de fuite",
      "captureRewards.candy": "Bonbons",
      "captureRewards.stardust": "Poussières",
      megaEnergyReward: "Énergie Méga",
      "secondChargeMoveCost.candy": "Bonbons",
      "secondChargeMoveCost.stardust": "Poussières",
      "availability.released": "Disponible",
      "availability.shinyReleased": "Shiny disponible",
      "availability.tradable": "Échangeable",
      "availability.pokemonHomeTransfer": "Transfert HOME",
      "availability.shadow": "Obscur",
      "availability.dynamax": "Dynamax",
      "availability.gigantamax": "Gigantamax",
      "availability.apex": "Apex",
      "maxCp.maxLevel50": "Niveau 50",
      "maxCp.maxLevel40": "Niveau 40",
      "maxCp.weatherBoostLevel25": "Boost météo N.25",
      "maxCp.raidLevel20": "Raid N.20",
      "maxCp.researchLevel15": "Étude N.15",
      pvp: "Données PvP",
    };

    const missingGroups = [
      { key: "size", title: "Taille et poids", matches: (field) => field.startsWith("size.") },
      { key: "capture", title: "Capture", matches: (field) => ["catchRate", "fleeRate", "weatherBoost", "buddyDistance"].includes(field) },
      { key: "rewards", title: "Récompenses", matches: (field) => field.startsWith("captureRewards.") || field === "megaEnergyReward" },
      { key: "secondMove", title: "Seconde attaque", matches: (field) => field.startsWith("secondChargeMoveCost.") },
      { key: "availability", title: "Disponibilité", matches: (field) => field.startsWith("availability.") },
      { key: "maxCp", title: "PC maximum", matches: (field) => field.startsWith("maxCp.") },
      { key: "pvp", title: "Combat PvP", matches: (field) => field === "pvp" || field.startsWith("pvp.") },
    ];

    function formatMissingField(field) {
      if (missingFieldLabels[field]) return missingFieldLabels[field];
      const parts = field.split(".");
      const league = parts[1] ? formatLeague(parts[1]) : "";
      const detail = parts.slice(2).join(".");
      const pvpLabels = {
        tierRank: "Tier",
        "rank1.ivs.attack": "IV Attaque",
        "rank1.ivs.defense": "IV Défense",
        "rank1.ivs.stamina": "IV Endurance",
        "rank1.level": "Niveau rang 1",
        "rank1.cp": "PC rang 1",
        "bestMovesets.fast": "Attaque rapide",
        "bestMovesets.charged": "Attaques chargées",
      };
      return detail ? `${league} · ${pvpLabels[detail] || detail}` : field;
    }

    function renderMissingFields(fields) {
      const grouped = missingGroups
        .map((group) => ({ ...group, fields: fields.filter(group.matches) }))
        .filter((group) => group.fields.length);
      const knownFields = new Set(grouped.flatMap((group) => group.fields));
      const otherFields = fields.filter((field) => !knownFields.has(field));
      if (otherFields.length) {
        grouped.push({ key: "other", title: "Autres", fields: otherFields });
      }

      return `
        <details class="missing-details">
          <summary>${fields.length} champ${fields.length > 1 ? "s" : ""} restant${fields.length > 1 ? "s" : ""} · afficher le détail</summary>
          <div class="missing-groups">
            ${grouped.map((group) => `
              <section class="missing-group">
                <div class="missing-group-title">
                  <span>${escapeHtml(group.title)}</span>
                  <span class="missing-group-count">${group.fields.length}</span>
                </div>
                <div class="missing-fields">
                  ${group.fields.map((field) => `<span class="missing-field" title="${escapeHtml(field)}">${escapeHtml(formatMissingField(field))}</span>`).join("")}
                </div>
              </section>
            `).join("")}
          </div>
        </details>`;
    }

    function updateStats() {
      const done = state.entries.filter(isDone).length;
      const total = state.entries.length;
      elements.doneCount.textContent = done;
      elements.todoCount.textContent = total - done;
      elements.pokemonCount.textContent = state.entries.filter((entry) => entry.type === "pokemon").length;
      elements.formCount.textContent = state.entries.filter((entry) => entry.type === "form").length;
      elements.megaCount.textContent = state.entries.filter((entry) => entry.type === "mega").length;
      elements.progressBar.style.width = `${total ? (done / total) * 100 : 0}%`;
    }

    function render() {
      const query = elements.search.value.trim().toLocaleLowerCase("fr");
      const visible = state.entries.filter((entry) => {
        const done = isDone(entry);
        const matchesQuery = !query || [entry.name, entry.dexId, entry.file, entry.parentName, entry.form]
          .some((value) => String(value || "").toLocaleLowerCase("fr").includes(query));
        return matchesQuery
          && (elements.type.value === "all" || entry.type === elements.type.value)
          && (elements.form.value === "all" || entry.form === elements.form.value)
          && (elements.generation.value === "all" || String(entry.generation) === elements.generation.value)
          && (elements.status.value === "all" || (elements.status.value === "done" ? done : !done));
      });

      elements.entries.innerHTML = visible.length ? visible.map((entry) => {
        const manuallyDone = Boolean(state.progress[entry.key]);
        const done = isDone(entry);
        const missing = entry.parseError
          ? `<div class="error">JSON invalide : ${escapeHtml(entry.parseError)}</div>`
          : entry.missingFields.length
            ? renderMissingFields(entry.missingFields)
            : "";
        const image = entry.image
          ? `<div class="portrait">
              <img class="pokemon-image" src="${escapeHtml(entry.image)}" alt="${escapeHtml(entry.name)}" loading="lazy" onerror="this.style.visibility='hidden'">
              ${entry.shinyImage ? `<img class="pokemon-image shiny" src="${escapeHtml(entry.shinyImage)}" alt="${escapeHtml(entry.name)} shiny" loading="lazy" onerror="this.remove()">` : ""}
            </div>`
          : '<div class="portrait missing-image">Image<br>absente</div>';
        const leagues = entry.pvpLeagues?.length
          ? ` · PvP : ${entry.pvpLeagues.map((league) => escapeHtml(formatLeague(league))).join(", ")}`
          : "";
        const context = entry.type === "pokemon"
          ? `Pokémon principal`
          : `${entry.type === "mega" ? "Méga / Primo" : "Forme spéciale"} de ${escapeHtml(entry.parentName)}`;
        return `
          <article class="entry ${done ? "done" : ""}">
            <input type="checkbox" data-key="${escapeHtml(entry.key)}" ${done ? "checked" : ""} ${entry.complete ? "disabled" : ""}>
            ${image}
            <div class="entry-content">
              <div class="name">#${escapeHtml(entry.dexId)} · ${escapeHtml(entry.name)}</div>
              <div class="meta">${context} · forme ${escapeHtml(entry.form)} · génération ${escapeHtml(entry.generation || "?")}${leagues}</div>
              <div class="file">${escapeHtml(entry.file)}</div>
              ${missing}
            </div>
            <div class="badges">
              ${entry.complete ? '<span class="badge auto">complet automatiquement</span>' : ""}
              ${manuallyDone ? '<span class="badge manual">coché manuellement</span>' : ""}
              ${!done ? `<span class="badge">${entry.missingFields.length || 1} point(s) restant(s)</span>` : ""}
            </div>
          </article>`;
      }).join("") : '<div class="empty">Aucune fiche ne correspond aux filtres.</div>';

      elements.entries.querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach((checkbox) => {
        checkbox.addEventListener("change", async () => {
          const response = await fetch("/api/progress", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: checkbox.dataset.key, checked: checkbox.checked }),
          });
          state.progress = (await response.json()).progress;
          updateStats();
          render();
        });
      });
      updateStats();
    }

    async function load() {
      elements.refresh.disabled = true;
      const response = await fetch("/api/checklist");
      Object.assign(state, await response.json());

      const selectedGeneration = elements.generation.value;
      const generations = [...new Set(state.entries.map((entry) => entry.generation).filter(Boolean))].sort((a, b) => a - b);
      elements.generation.innerHTML = '<option value="all">Toutes générations</option>'
        + generations.map((generation) => `<option value="${generation}">Génération ${generation}</option>`).join("");
      elements.generation.value = generations.includes(Number(selectedGeneration)) ? selectedGeneration : "all";

      const selectedForm = elements.form.value;
      const forms = [...new Set(state.entries.map((entry) => entry.form).filter(Boolean))].sort();
      elements.form.innerHTML = '<option value="all">Toutes les formes</option>'
        + forms.map((form) => `<option value="${escapeHtml(form)}">${escapeHtml(form)}</option>`).join("");
      elements.form.value = forms.includes(selectedForm) ? selectedForm : "all";

      elements.refresh.disabled = false;
      render();
    }

    ["search", "type", "form", "status", "generation"].forEach((id) => elements[id].addEventListener("input", render));
    elements.refresh.addEventListener("click", load);
    load();
  </script>
</body>
</html>
